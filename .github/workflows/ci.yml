name: ci

on:
  push:
  pull_request:

jobs:
  linux-x86_64:
    name: ubuntu x86-64 (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DLANECAST_WERROR=ON -DLANECAST_BENCH_FFMPEG=OFF
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: ISA tiers
        run: ./build/tools/lanecast info
      - name: Test (best ISA)
        run: ctest --test-dir build --output-on-failure
      - name: Test (LANECAST_ISA=scalar)
        run: ctest --test-dir build --output-on-failure
        env:
          LANECAST_ISA: scalar
      - name: Test (LANECAST_ISA=sse41)
        run: ctest --test-dir build --output-on-failure
        env:
          LANECAST_ISA: sse41
      - name: Test (LANECAST_ISA=avx2)
        run: ctest --test-dir build --output-on-failure
        env:
          LANECAST_ISA: avx2

  linux-scalar-only:
    name: ubuntu x86-64 (SIMD off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DLANECAST_WERROR=ON -DLANECAST_ENABLE_SIMD=OFF -DLANECAST_BENCH_FFMPEG=OFF
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-arm64:
    name: macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DLANECAST_WERROR=ON -DLANECAST_BENCH_FFMPEG=OFF
      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"
      - name: ISA tiers
        run: ./build/tools/lanecast info
      - name: Test (best ISA)
        run: ctest --test-dir build --output-on-failure
      - name: Test (LANECAST_ISA=scalar)
        run: ctest --test-dir build --output-on-failure
        env:
          LANECAST_ISA: scalar
      - name: Test (LANECAST_ISA=neon)
        run: ctest --test-dir build --output-on-failure
        env:
          LANECAST_ISA: neon
